# VLX build profile: the feature cuts, as Meson project options.
# Picked by the owner on 2026-11-21 in the feature-cut list (https://claude.ai/artifact/RuTvLsQRzYzFgXGGbeJEbb).
# build.sh turns these into -D flags with extras/vlx/meson-flags.sh and passes them last, so they win over its
# own hard-coded flags (such as -Dskins2=enabled). Nothing upstream is deleted:
# a cut module just isn't built, so it never ships or loads.
#
# Deliberate exceptions to the picks:
# - stream_outputs stays on: Chromecast and the Record button need it (owner's choice, 2026-11-21).
# - x264 stays on: Chromecast transcodes with it. Without it, casting falls back to slow VP8 software encoding.
# - libdvbpsi stays on: the MPEG-TS demuxer needs it (.ts, .m2ts, HLS). Only the TV-tuner access (dtv) is cut.
# - netsync needs no switch: upstream's Meson build doesn't build it.

[project options]
# Streaming and conversion
videolan_manager = false
shout = 'disabled'
srt = 'disabled'
rist = 'disabled'
decklink = 'disabled'
ndi = 'disabled'
# Encoders (playback doesn't use them; x264 kept for Chromecast)
x265 = 'disabled'
x262 = 'disabled'
rav1e = 'disabled'
theoraenc = 'disabled'
daalaenc = 'disabled'
shine = 'disabled'
twolame = 'disabled'
# Interfaces
skins2 = 'disabled'
update-check = 'disabled'
# Packaging: VLX ships the NSIS installer and a portable 7z, not an MSI (WiX needs cygpath/Wine on the build machine)
wix = 'disabled'
# libssp's __stack_chk_fail clashes with the prebuilt FLAC (multiple definition at link time), locally and in CI
ssp = 'disabled'
# TV, teletext and broadcast subtitles
dvbcsa = 'disabled'
zvbi = 'disabled'
telx = 'disabled'
aribb24 = 'disabled'
aribsub = 'disabled'
aribb25 = 'disabled'
aribcaption = 'disabled'
# Remote desktop inputs
vnc = 'disabled'
freerdp = 'disabled'
# Computer-vision filters, fingerprinting, rare formats
opencv = 'disabled'
sam3 = 'disabled'
libchromaprint = 'disabled'
daaladec = 'disabled'
bpg = 'disabled'
# Modules with no switch of their own
# opencv_*: upstream's Meson ignores the opencv switch and builds these whenever OpenCV is found
disable_modules = ['dtv', 'sap', 'opencv_wrapper', 'opencv_example']
