# VLX: Windows installer and portable build.
#
# Run it from the Actions tab (Run workflow) to get the files as a build artifact, or push a tag like v0.1.0
# to also publish a GitHub release with them. It cross-compiles in VideoLAN's own Windows build image, the
# same one VLC's CI uses (see extras/ci/gitlab-ci.yml), with VideoLAN's prebuilt dependencies.
name: Release (Windows)

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      lto:
        description: Link-time optimisation (slower build, what VLX ships)
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-x64:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    container:
      # Keep in step with VLC_WIN64_IMAGE in extras/ci/gitlab-ci.yml after each upstream update.
      image: registry.videolan.org/vlc-debian-win64-posix:20261109074440
      options: --user root
    env:
      # GitHub mounts its own /github/home, owned by another user; Wine (Meson runs its compiler checks through
      # it) refuses to start there, so give root its own home.
      HOME: /root
      # A fresh Wine profile otherwise stops at the Wine Mono / Gecko install prompt, which nobody can answer here
      # (the build hung after "meson setup" until the job timed out). Skip them and keep Wine quiet.
      WINEPREFIX: /root/.wine
      WINEDLLOVERRIDES: "mscoree,mshtml="
      WINEDEBUG: "-all"
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Prepare Wine
        run: |
          # create the Wine profile up front, never for longer than 5 minutes, and prove Wine can run a program
          timeout 300 wineboot -i || echo "::warning::wineboot didn't finish cleanly"
          timeout 60 wineserver -w || true
          timeout 60 wine cmd /c echo wine-ok

      - name: Version
        run: |
          # extras/vlx/VERSION is the version; a v<version> tag must match it. Manual runs are <version>-dev.<run>.
          v=$(tr -d '[:space:]' < extras/vlx/VERSION)
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            tag="${GITHUB_REF_NAME#v}"
            case "$tag" in "$v"|"$v"-*) ;; *) echo "::error::Tag $GITHUB_REF_NAME doesn't match extras/vlx/VERSION ($v)"; exit 1;; esac
            v="$tag"
          else
            v="$v-dev.${GITHUB_RUN_NUMBER}"
          fi
          echo "VLX_VERSION=$v" >> "$GITHUB_ENV"
          # a plain x.y.z tag is a stable release; one with a suffix (-beta, -rc1) is a pre-release
          case "$v" in *-*) echo "VLX_PRERELEASE=true" >> "$GITHUB_ENV";; *) echo "VLX_PRERELEASE=false" >> "$GITHUB_ENV";; esac
          echo "Version $v"

      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # VideoLAN's prebuilt dependencies for VLX's upstream base (see UPSTREAM.md); without them
          # every dependency, Qt included, is compiled from source, which takes hours.
          url="https://artifacts.videolan.org/vlc/win64/vlc-contrib-x86_64-w64-mingw32-$(cat .vlx-contrib-sha).tar.zst"
          if curl -sfI "$url" > /dev/null; then
            export VLC_PREBUILT_CONTRIBS_URL="$url"
            echo "Using prebuilt dependencies: $url"
          else
            echo "::warning::No prebuilt dependencies at $url; building them from source (slow)."
          fi
          FLAGS="-a x86_64 -p -m -r"
          if [ "${{ github.event_name }}" != "workflow_dispatch" ] || [ "${{ inputs.lto }}" = "true" ]; then
            FLAGS="$FLAGS -t"
          fi
          ./extras/package/win32/build.sh $FLAGS

      - name: Package
        run: |
          cd win64-meson
          meson install --strip --no-rebuild
          ninja package-win32-7zip package-win32-exe

      - name: Collect files
        run: |
          mkdir -p dist
          exe=$(find win64-meson -maxdepth 1 -name 'vlx-*-win64*.exe' ! -name '*spad*' | head -n 1)  # named after the VLX version
          sz=$(find win64-meson -maxdepth 1 -name 'vlx-*-win64*.7z' ! -name '*debug*' | head -n 1)
          test -n "$exe" && test -n "$sz"
          cp "$exe" "dist/VLX-${VLX_VERSION}-windows-x64-setup.exe"
          cp "$sz"  "dist/VLX-${VLX_VERSION}-windows-x64-portable.7z"
          cd dist && sha256sum * > "sha256-${VLX_VERSION}.txt" && cat "sha256-${VLX_VERSION}.txt"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: VLX-${{ env.VLX_VERSION }}-windows-x64
          path: dist/*
          retention-days: 14

      - name: Write release notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          base=$(cat .vlx-base 2>/dev/null || echo unknown)
          cat > notes.md <<EOF
          VLX ${VLX_VERSION} for Windows (x64), a personal fork of [VLC media player](https://www.videolan.org/vlc/).
          All credit for the engine and codecs goes to VideoLAN and VLC's contributors. VLX isn't affiliated with VideoLAN.

          - **Setup:** \`VLX-${VLX_VERSION}-windows-x64-setup.exe\`
          - **Portable:** \`VLX-${VLX_VERSION}-windows-x64-portable.7z\`. Unpack it and add an empty \`portable\` folder next to \`vlx.exe\` to keep settings beside it.
          - Checksums: \`sha256-${VLX_VERSION}.txt\`

          Built on VLC upstream \`${base}\`. The files aren't code-signed, so Windows SmartScreen may warn on first run.
          EOF
          sed -i 's/^          //' notes.md

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: VLX ${{ env.VLX_VERSION }}
          body_path: notes.md
          prerelease: ${{ env.VLX_PRERELEASE == 'true' }}
          files: dist/*
